// Top-level build file where you can add configuration options common to all sub-projects/modules.  
buildscript {
    repositories {
        // Use the modern, required repositories. jcenter is shut down.
        google()
        mavenCentral()
    }
    dependencies {
        // Upgraded to AGP 8.10.0 to match Gradle 8.11.1 and Android SDK 36 (same as LunarTag)
        classpath 'com.android.tools.build:gradle:8.10.0'
        
        // REQUIRED: Add the Google services classpath for AdMob integration
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        // Ensure all parts of the project use the modern repositories.
        google()
        mavenCentral()
        // Jitpack is sometimes needed for other libraries.
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}